services:

  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./website1:/usr/share/nginx/site1:ro
      - ./website2:/usr/share/nginx/site2:ro
    depends_on:
      - nodered

  nodered:
    image: nodered/node-red:latest
    container_name: web_nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data

  mariadb:
    image: mariadb:latest
    container_name: web_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: webdb
      MYSQL_USER: webuser
      MYSQL_PASSWORD: web123
    volumes:
      - mariadb_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: web_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: root
      PMA_PASSWORD: root123
    depends_on:
      - mariadb
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web_cloudflared
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
volumes:
  mariadb_data:
