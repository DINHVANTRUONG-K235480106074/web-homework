server {
    listen 80;
    server_name site1.localhost;

    root /usr/share/nginx/site1;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name site2.localhost;

    root /usr/share/nginx/site2;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
